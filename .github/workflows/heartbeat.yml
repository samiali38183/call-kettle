# Public uptime check against the live product URLs. No secrets.
name: heartbeat
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Public site
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" https://callkettle.com) && [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "callkettle.com did not return 200"; exit 1
      - name: API health
        run: |
          for i in 1 2 3; do
            body=$(curl -fsS -m 15 https://app.callkettle.com/health) && echo "$body" | grep -q '"status":"ok"' && exit 0
            sleep 10
          done
          echo "app.callkettle.com/health failed 3 times"; exit 1
