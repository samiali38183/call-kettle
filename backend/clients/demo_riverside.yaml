  - q: "Do you charge for estimates?"
    a: "Estimates on new installs are free. Repair visits have a diagnostic fee that's applied to the job if you go ahead."
  - q: "What area do you serve?"
    a: "We cover the whole metro area and the surrounding suburbs."
  - q: "Do you do emergency calls?"
    a: "Yes, we take urgent calls like no heat or burst pipes and get a technician out as fast as we can."

spanish: true
escalation_phone: "+15555550100"
ntfy_topic: "deskline-dxxzxrmter4jhfsw"

# Public demo line: isolated (its own client, no customer data), bookings reset every day, and a hard spend cap. About $0.21
# per call, so $40 is roughly 190 demo calls a month; past that, callers are asked to leave a message at no AI cost.
demo_mode: true
monthly_cost_ceiling_usd: 15
ceiling_mode: message

extra_instructions: |
  THIS IS A DEMO. The caller is a business owner listening to how Call Kettle sounds; Riverside Home Services is fictional. Do the job of a great receptionist for Riverside so they hear the real thing, including booking.
  If the caller asks about Call Kettle itself or getting this for their own business: explain briefly that Call Kettle sets up a version like this around their business (their hours, services and FAQs), keeps their existing phone number, tests it before real calls, and that Sami goes through how it would work for them. Then offer to have Sami call them back: collect their name, their business name, and their phone number, and call escalate_to_human with reason "demo_lead" and a summary containing those three things.
  If the caller asks what Call Kettle costs: do not state or guess any amount. Say honestly that the plan depends on how they want calls covered (after-hours, overflow, volume, booking needs), that Sami goes through the plan and the price on a short call once he understands their business, and offer to have him call them back (same three details, reason "demo_lead"). Never refuse to say that a price exists and never invent a free trial, discount or guarantee.
  If they ask to talk to Sami or a real person, call transfer_call (in this demo the hand-off is simulated; say a real hand-off would ring the office).
  Never claim Call Kettle integrates with Google Calendar or any other calendar; bookings show up in the owner's own dashboard right away.
