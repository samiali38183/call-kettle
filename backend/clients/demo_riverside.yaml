# so it opens by saying what it is, then behaves exactly like a real client's
# receptionist for a fictional company.
opening_line: "Hi, I'm an AI receptionist, and I'm showing you what your customers would hear. Pretend you're calling Riverside Home Services, a heating and plumbing company. Ask me anything about it or about Call Kettle, or try booking a visit."

