<text x="22" y="645.0" font-size="14" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" xml:space="preserve"><tspan fill="#e2e8f0">bookings        3 before, 3 after; changed: no booking row changed</tspan></text>
<text x="22" y="665.0" font-size="14" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" xml:space="preserve"><tspan fill="#e2e8f0">state check     the victim's booking is still confirmed: </tspan><tspan fill="#4ade80">held</tspan></text>
