<text x="22" y="385.0" font-size="14" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" xml:space="preserve"><tspan fill="#e2e8f0">tool outcome    not run. The model was told: that action is not available for this business; take the ...</tspan></text>
