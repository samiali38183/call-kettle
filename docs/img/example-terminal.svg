<text x="22" y="185.0" font-size="14" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" xml:space="preserve"><tspan fill="#e2e8f0">tool outcome    run, succeeded</tspan></text>
<text x="22" y="205.0" font-size="14" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" xml:space="preserve"><tspan fill="#e2e8f0">audit row       tool=book_appointment decision=allowed control=allowed</tspan></text>
